services:
  postgres:
    image: postgres:16
    container_name: devops_gateway_db
    restart: always
    environment:
      POSTGRES_USER: devops_admin
      POSTGRES_PASSWORD: devops_pass
      POSTGRES_DB: devops_gateway
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: